<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']], // 인라인 수식 $...$ 사용 설정
    displayMath: [['$$', '$$'], ['\\[', '\\]']] // 디스플레이 수식 $$...$$ 사용 설정
  },
  svg: {
    fontCache: 'global' // SVG 출력 시 폰트 캐시 설정 (CHTML 출력 시에는 영향 적음)
  }
};
</script>
